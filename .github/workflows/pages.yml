name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Pages site from allowlisted files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site/dynaco/documents/manuals | Out-Null
          Copy-Item index.html, 404.html, favicon.svg, robots.txt, CNAME _site/
          Copy-Item dynaco/index.html _site/dynaco/
          Copy-Item dynaco/documents/index.html, dynaco/documents/catalog.json _site/dynaco/documents/
          Copy-Item dynaco/documents/manuals/*.pdf _site/dynaco/documents/manuals/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
