<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Searchable library of Dynaco manuals and service documents."><title>Dynaco Documents — cothrell.org</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243b36;font-family:system-ui,sans-serif;padding:clamp(1.25rem,5vw,4rem)}main{max-width:70rem;margin:auto}.crumb{font-size:.85rem;color:#5c7068}.crumb a{color:inherit}.label{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:#5c7068;margin-top:2.5rem}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.8rem,7vw,5.5rem);letter-spacing:-.05em;line-height:1;margin:1rem 0}.intro{font-size:1.1rem;line-height:1.7;max-width:46rem}input{width:100%;padding:.85rem 1rem;border:1px solid #aabbb0;background:#fff;font:inherit;color:inherit;margin:1.5rem 0 .7rem}input:focus{outline:2px solid #607d70;outline-offset:1px}.meta{font-size:.9rem;color:#5c7068;margin-bottom:1.25rem}.list{display:grid;gap:.65rem}.item{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border:1px solid #d0d8d1;background:#faf9f5;padding:.9rem 1rem;text-decoration:none;color:inherit}.item:hover,.item:focus{border-color:#789184;background:#fff}.title{font-weight:600}.kind{font-size:.8rem;color:#5c7068;white-space:nowrap}.empty{color:#5c7068;padding:1.5rem 0}</style></head><body><main><div class="crumb"><a href="/">cothrell.org</a> / <a href="/dynaco/">Dynaco</a> / Documents</div><div class="label">Dynaco reference archive</div><h1>Documents</h1><p class="intro">Manuals, schematics, and service literature copied from the public <a href="https://github.com/scott-cothrell/Dynaco">Dynaco repository</a>. Select a document to open the PDF.</p><label for="search"><span class="visually-hidden">Search documents</span></label><input id="search" type="search" placeholder="Search by model, title, or document type" autocomplete="off"><div id="meta" class="meta" aria-live="polite">Loading catalog…</div><div id="list" class="list"></div></main><script>const search=document.querySelector('#search'),list=document.querySelector('#list'),meta=document.querySelector('#meta');let items=[];const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=search.value.trim().toLowerCase();const shown=items.filter(x=>!q||`${x.title} ${x.kind} ${x.filename}`.toLowerCase().includes(q));meta.textContent=`${shown.length} of ${items.length} documents`;list.innerHTML=shown.length?shown.map(x=>`<a class="item" href="${encodeURI(x.url)}"><span class="title">${esc(x.title)}</span><span class="kind">${esc(x.kind)}</span></a>`).join(''):'<div class="empty">No documents match that search.</div>'}search.addEventListener('input',render);fetch('catalog.json').then(r=>r.json()).then(x=>{items=x.items||[];render()}).catch(()=>{meta.textContent='The catalog could not be loaded.';list.innerHTML='<div class="empty">Please try again later.</div>'});</script></body></html>
