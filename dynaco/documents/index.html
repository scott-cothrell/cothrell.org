<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Searchable library of Dynaco manuals and service documents.">
    <title>Dynaco Documents — cothrell.org</title>

    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f3ed;
        color: #243b36;
        font-family: system-ui, sans-serif;
        padding: clamp(1.25rem, 5vw, 4rem);
      }

      main {
        max-width: 70rem;
        margin: auto;
      }

      .crumb {
        font-size: 0.85rem;
        color: #5c7068;
      }

      .crumb a {
        color: inherit;
      }

      .label {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5c7068;
        margin-top: 2.5rem;
      }

      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.8rem, 7vw, 5.5rem);
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 1rem 0;
      }

      .intro {
        font-size: 1.1rem;
        line-height: 1.7;
        max-width: 46rem;
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid #aabbb0;
        background: #fff;
        font: inherit;
        color: inherit;
        margin: 1.5rem 0 0.7rem;
      }

      input:focus {
        outline: 2px solid #607d70;
        outline-offset: 1px;
      }

      .meta {
        font-size: 0.9rem;
        color: #5c7068;
        margin-bottom: 1.25rem;
      }

      .list {
        display: grid;
        gap: 0.65rem;
      }

      .item {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid #d0d8d1;
        background: #faf9f5;
        padding: 0.9rem 1rem;
        text-decoration: none;
        color: inherit;
      }

      .item:hover,
      .item:focus {
        border-color: #789184;
        background: #fff;
      }

      .title {
        font-weight: 600;
      }

      .kind {
        font-size: 0.8rem;
        color: #5c7068;
        white-space: nowrap;
      }

      .empty {
        color: #5c7068;
        padding: 1.5rem 0;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="crumb">
        <a href="/">cothrell.org</a> /
        <a href="/dynaco/">Dynaco</a> /
        Documents
      </div>

      <div class="label">Dynaco reference archive</div>

      <h1>Documents</h1>

      <p class="intro">
        Manuals, schematics, and service literature copied from the public
        <a href="https://github.com/scott-cothrell/Dynaco">Dynaco repository</a>.
        Select a document to open the PDF.
      </p>

      <label for="search">
        <span class="visually-hidden">Search documents</span>
      </label>
      <input
        id="search"
        type="search"
        placeholder="Search by model, title, or document type"
        autocomplete="off"
      >

      <div id="meta" class="meta" aria-live="polite">Loading catalog…</div>
      <div id="list" class="list"></div>
    </main>

    <script>
      const search = document.querySelector('#search');
      const list = document.querySelector('#list');
      const meta = document.querySelector('#meta');
      let items = [];

      function getDocumentUrl(value) {
        if (typeof value !== 'string') {
          return null;
        }

        try {
          const url = new URL(value, document.baseURI);
          const manualsPath = new URL('manuals/', document.baseURI).pathname;

          if (
            url.origin !== window.location.origin ||
            !url.pathname.startsWith(manualsPath) ||
            !url.pathname.toLowerCase().endsWith('.pdf')
          ) {
            return null;
          }

          return url.href;
        } catch {
          return null;
        }
      }

      function render() {
        const query = search.value.trim().toLowerCase();
        const shown = items.filter((item) => {
          const text = `${item.title} ${item.kind} ${item.filename}`.toLowerCase();
          return !query || text.includes(query);
        });

        meta.textContent = `${shown.length} of ${items.length} documents`;
        list.replaceChildren();

        if (!shown.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No documents match that search.';
          list.append(empty);
          return;
        }

        shown.forEach((item) => {
          const url = getDocumentUrl(item.url);
          const entry = url ? document.createElement('a') : document.createElement('div');
          const title = document.createElement('span');
          const kind = document.createElement('span');

          entry.className = 'item';
          title.className = 'title';
          kind.className = 'kind';
          title.textContent = item.title || 'Untitled document';
          kind.textContent = item.kind || 'Reference';
          entry.append(title, kind);

          if (url) {
            entry.href = url;
          } else {
            entry.setAttribute('aria-disabled', 'true');
          }

          list.append(entry);
        });
      }

      search.addEventListener('input', render);

      fetch('catalog.json')
        .then((response) => response.json())
        .then((catalog) => {
          items = catalog.items || [];
          render();
        })
        .catch(() => {
          meta.textContent = 'The catalog could not be loaded.';
          list.replaceChildren();

          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'Please try again later.';
          list.append(empty);
        });
    </script>
  </body>
</html>
